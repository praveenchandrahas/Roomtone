<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>autocal</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">&#9835;</span> autocal <span class="muted small">room calibration, local only</span></div>
  <nav aria-label="Pages">
    <label class="runsel">Run
      <select id="runselect" aria-label="Choose a run"></select>
    </label>
    <a id="nav-run" href="#/">Live run</a>
    <a id="nav-results" href="#/">Results</a>
  </nav>
</header>
<div id="banner" class="banner" role="status" hidden></div>
<main id="main" tabindex="-1"></main>
<footer class="foot muted small">Listening on this machine only. Nothing is applied until you type APPLY. All numbers are relative dB; no SPL claim anywhere.</footer>
<script src="/charts.js"></script>
<script src="/app.js"></script>
</body>
</html>
