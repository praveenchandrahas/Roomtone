# Runs this repository's tests on GitHub's servers. It has read-only access to the code, no secrets, and cannot touch any machine of yours.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check out linux-theater-dsp (public, read-only) so the tests that need set-eq.py run instead of skipping
        uses: actions/checkout@v4
        with:
          repository: praveenchandrahas/linux-theater-dsp
          path: deps/linux-theater-dsp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - run: bash tests/run.sh
        env:
          SET_EQ: ${{ github.workspace }}/deps/linux-theater-dsp/scripts/set-eq.py
