<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theater-token" content="__TOKEN__">
<title>Theatre control</title>
<style>
:root {
  --bg: #0e141b; --panel: #151d27; --line: #243142; --text: #e6edf3; --muted: #8b9bb0;
  --accent: #38bdf8; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --bg: #f4f6f9; --panel: #ffffff; --line: #d5dce6; --text: #16202c; --muted: #5a6b80; --accent: #0369a1; --ok: #15803d; --warn: #a16207; --bad: #b91c1c; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 16px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
h1 { font-size: 20px; margin: 0; flex: 1; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }
.dot.on { background: var(--ok); }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.card h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; }
dt { color: var(--muted); } dd { margin: 0; word-break: break-word; }
.big { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; }
.badge.ok { color: var(--ok); border-color: var(--ok); } .badge.warn { color: var(--warn); border-color: var(--warn); } .badge.bad { color: var(--bad); border-color: var(--bad); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.seg button { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #04121c; font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.lbl { display: block; color: var(--muted); font-size: 13px; }
.meter { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 2px 0 8px; }
.meter > i { display: block; height: 100%; background: var(--ok); width: 0; }
#msg { min-height: 1.4em; color: var(--muted); margin-top: 8px; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; max-width: 360px; }
dialog::backdrop { background: rgba(0,0,0,.5); }
dialog menu { display: flex; gap: 8px; justify-content: flex-end; padding: 0; margin: 12px 0 0; }
dialog button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; }
dialog button.go { background: var(--accent); border-color: var(--accent); color: #04121c; font-weight: 600; }
.small { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header><span id="dot" class="dot" title="connection"></span><h1>Theatre control</h1><span id="age" class="small"></span></header>
  <div class="grid">
    <section class="card" aria-labelledby="h-now"><h2 id="h-now">Now playing</h2>
      <div class="big" id="now">…</div><dl id="nowdl"></dl></section>
    <section class="card" aria-labelledby="h-prof"><h2 id="h-prof">Profile and engine</h2><dl id="profdl"></dl></section>
    <section class="card" aria-labelledby="h-dsp"><h2 id="h-dsp">CamillaDSP live</h2><dl id="dspdl"></dl>
      <label class="lbl">Capture peak (worst channel)</label><div class="meter"><i id="mcap"></i></div>
      <label class="lbl">Playback peak (worst channel)</label><div class="meter"><i id="mplay"></i></div></section>
    <section class="card" aria-labelledby="h-ctl"><h2 id="h-ctl">Controls</h2>
      <label class="lbl">EQ</label><div class="seg" data-act="eq" role="group" aria-label="EQ"></div>
      <label class="lbl">Profile mode</label><div class="seg" data-act="mode" role="group" aria-label="Profile mode"></div>
      <label class="lbl">Stereo upmix flavour</label><div class="seg" data-act="flavour" data-kind="stereo" role="group" aria-label="Stereo flavour"></div>
      <label class="lbl">5.1 upmix flavour</label><div class="seg" data-act="flavour" data-kind="bed" role="group" aria-label="Bed flavour"></div>
      <label class="lbl">Adaptive engine</label><div class="seg" data-act="engine" role="group" aria-label="Adaptive engine"></div>
      <div id="msg" role="status" aria-live="polite"></div></section>
  </div>
  <p class="small">Local only (127.0.0.1). Applying room corrections stays in autocal. Some changes cause about a second of silence and ask first.</p>
</main>
<dialog id="dlg"><form method="dialog"><p id="dlgtext"></p><menu><button value="cancel">Cancel</button><button value="ok" class="go">Continue</button></menu></form></dialog>
<script>
"use strict";
const TOKEN = document.querySelector('meta[name="theater-token"]').content;
const OPTS = { eq: ["on", "off"], mode: ["auto", "film", "stereo", "bed"], engine: ["on", "off"],
  stereo: ["voice", "balanced", "wide"], bed: ["subtle", "balanced", "wide"] };
let last = null;

function el(tag, text, cls) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
function rows(dl, pairs) {
  dl.replaceChildren();
  for (const [k, v, cls] of pairs) { dl.append(el("dt", k)); const dd = el("dd"); if (cls) dd.append(el("span", v, "badge " + cls)); else dd.textContent = v; dl.append(dd); }
}
const fmt = (v, u) => (v === null || v === undefined) ? "n/a" : (typeof v === "number" ? v.toFixed(v % 1 ? 1 : 0) : v) + (u || "");
const worst = a => Array.isArray(a) && a.length ? Math.max(...a) : null;
const meter = (id, db) => { document.getElementById(id).style.width = db === null ? "0%" : Math.max(0, Math.min(100, (db + 60) / 60 * 100)) + "%"; };

function render(s) {
  last = s;
  document.getElementById("dot").classList.toggle("on", !s.error);
  const eq = s.eq || {}, dsp = s.dsp || {}, m = s.mpv || {}, en = dsp.engine || {};
  const apps = (s.apps || []).filter(a => a.patched || a.total);
  if (s.pipewire === false) { document.getElementById("now").textContent = "PipeWire not reachable"; }
  else if (m.playing) {
    const src = m.source;
    document.getElementById("now").textContent = src ? `${src.codec} ${src.channels}ch → ${src.kind}` : "mpv (source not identified)";
  } else if (apps.length) document.getElementById("now").textContent = apps.map(a => a.name).join(", ") + " (stereo app)";
  else document.getElementById("now").textContent = "Nothing playing";
  const v = m.verdict, vb = { cam: ["Through CamillaDSP (EQ active)", "ok"], direct: ["Direct, no EQ", "warn"], mixed: ["Routing unfinished", "warn"], "usb-missing": ["USB interface not connected", "bad"] }[v];
  const nowRows = [];
  if (m.source) nowRows.push(["Why", m.source.why]);
  if (m.route) nowRows.push(["Route", `via DSP ${m.route.via}/${m.route.channels}, direct ${m.route.direct}/${m.route.channels}, DSP→USB ${m.route.to_usb}/8`]);
  if (vb) nowRows.push(["Path", vb[0], vb[1]]);
  for (const a of apps) nowRows.push([a.name, `${a.patched}/${a.total} channels patched into CamillaDSP`]);
  rows(document.getElementById("nowdl"), nowRows);
  const pinned = dsp.pmode && dsp.pmode !== "auto";
  rows(document.getElementById("profdl"), [
    ["Profile", dsp.profile || "n/a"], ["Mode", (dsp.pmode || "n/a") + (pinned ? " (pinned)" : ""), pinned ? "warn" : null],
    ["EQ switch", (eq.switch || "n/a").toUpperCase(), eq.switch === "off" ? "warn" : null],
    ["Router", eq.router || "n/a", eq.router === "active" ? "ok" : "bad"], ["CamillaDSP", eq.camilla || "n/a", eq.camilla === "active" ? "ok" : "bad"],
    ["Config", eq.camilla_summary || "n/a"],
    ["Engine", en.state ? `${en.state}, service ${en.service}, ports ${en.ports_up ? "up" : "down"}${en.linked ? ", linked" : ""}` : "n/a", en.state === "failed" ? "bad" : null]
  ].filter(r => r[1] !== undefined));
  const L = s.live || {};
  if (L.ok) {
    rows(document.getElementById("dspdl"), [["State", fmt(L.state)], ["Sample rate", fmt(L.capture_rate, " Hz")], ["Load", fmt(L.load_percent, " %")],
      ["Buffer", fmt(L.buffer_level, " frames")], ["Clipped", fmt(L.clipped_samples), L.clipped_samples ? "bad" : null],
      ["Buffer-empty warnings (60 s)", s.underruns_60s === null || s.underruns_60s === undefined ? "n/a (idle)" : fmt(s.underruns_60s), s.underruns_60s ? "warn" : null]]);
    meter("mcap", worst(L.capture_peak_db)); meter("mplay", worst(L.playback_peak_db));
  } else {
    rows(document.getElementById("dspdl"), [["Live data", L.reason || "not available"], ["Buffer-empty warnings (60 s)", s.underruns_60s === null || s.underruns_60s === undefined ? "n/a (idle)" : fmt(s.underruns_60s), s.underruns_60s ? "warn" : null]]);
    meter("mcap", null); meter("mplay", null);
  }
  const cur = { eq: eq.switch, mode: dsp.pmode, engine: en.state, stereo: (dsp.flavours || {}).stereo, bed: (dsp.flavours || {}).bed };
  for (const box of document.querySelectorAll(".seg")) {
    const act = box.dataset.act, kind = box.dataset.kind, key = kind || act;
    if (!box.children.length) for (const o of OPTS[key]) { const b = el("button", o); b.type = "button"; b.dataset.value = o; b.addEventListener("click", () => doAction(act, o, kind)); box.append(b); }
    for (const b of box.children) b.setAttribute("aria-pressed", String(b.dataset.value === cur[key]));
  }
  document.getElementById("age").textContent = new Date().toLocaleTimeString();
}

async function post(body) {
  const r = await fetch("/v1/action", { method: "POST", headers: { "Content-Type": "application/json", "X-Theater-Token": TOKEN }, body: JSON.stringify(body) });
  return [r.status, await r.json().catch(() => ({}))];
}
async function doAction(action, value, kind) {
  const msg = document.getElementById("msg"); msg.textContent = "Working…";
  const body = { action, value }; if (kind) body.kind = kind;
  let [code, j] = await post(body);
  if (code === 409 && j.error === "confirm") {
    const dlg = document.getElementById("dlg"); document.getElementById("dlgtext").textContent = j.message + ". Continue?";
    const ok = await new Promise(res => { dlg.addEventListener("close", () => res(dlg.returnValue === "ok"), { once: true }); dlg.showModal(); });
    if (!ok) { msg.textContent = "Cancelled."; return; }
    body.confirm = true; [code, j] = await post(body);
  }
  msg.textContent = j.ok ? (j.noop ? "Already set." : "Done.") : ("Failed: " + (j.error || j.output || code));
  refresh();
}
async function refresh() { try { render(await (await fetch("/v1/status")).json()); } catch (e) { document.getElementById("dot").classList.remove("on"); } }
refresh();
try { const es = new EventSource("/v1/events"); es.onmessage = e => render(JSON.parse(e.data)); es.onerror = () => { document.getElementById("dot").classList.remove("on"); }; } catch (e) { setInterval(refresh, 2000); }
</script>
</body>
</html>
